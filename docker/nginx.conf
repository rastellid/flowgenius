server {
    listen 80;
    server_name _;
    root /var/www/flowgenius/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Pass the PHP scripts to php-fpm running in the same container
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevent URIs that include the front controller from being passed verbatim
        internal;
    }

    # Return 404 for all other .php files (no direct access)
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
