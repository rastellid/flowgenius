name: flowgenius

services:
  app:
    container_name: flowgenius_app
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      # Bind mount: project files are shared between host and container
      - .:/var/www/flowgenius
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://app:app@database:5432/app?serverVersion=18&charset=utf8"
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: flowgenius_db
    image: postgres:18
    environment:
      POSTGRES_DB: flowgenius_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ stores data in a version-specific subdir; mount the parent dir
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d flowgenius_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: flowgenius_db_volume
